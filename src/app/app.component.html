<a class="skip-link" href="#contenido-principal">Ir al contenido principal</a>

<app-quick-exit></app-quick-exit>

@if (auth.isAuthenticated()) {
  <div class="auth-layout">
    <app-header (toggleSidenav)="sidenav.toggle()"></app-header>

    <mat-sidenav-container class="sidenav-container">
      <mat-sidenav #sidenav mode="side" [opened]="!isHomeRoute()" [hidden]="isHomeRoute()" class="aside-menu">
        <app-sidebar></app-sidebar>
      </mat-sidenav>

      <mat-sidenav-content class="main-content">
        <main class="page-wrapper" id="contenido-principal">
          <router-outlet></router-outlet>
        </main>
      </mat-sidenav-content>
    </mat-sidenav-container>
  </div>
} @else {
  @if (isLoginRoute()) {
    <div class="full-screen-login">
      <router-outlet></router-outlet>
    </div>
  } @else {
    <div class="public-viewport-wrapper">
      <app-header></app-header>
      <app-public-header></app-public-header>

      <main class="content-area" id="contenido-principal">
        <router-outlet></router-outlet>
      </main>

      <app-public-footer></app-public-footer>
    </div>
  }
}

@if (loadingService.loading$ | async) {
  <div class="global-loading-overlay" role="status" aria-live="polite" aria-busy="true">
    <mat-spinner diameter="54"></mat-spinner>
    <span class="visually-hidden">Cargando información…</span>
  </div>
}
