<h2 mat-dialog-title class="modal-title">Agregar Teléfono</h2>

<mat-dialog-content class="modal-content">
  <div class="form-grid">

    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Tipo de Teléfono</mat-label>
      <mat-select [(ngModel)]="data.tipo">
        <mat-option value="Personal">Personal</mat-option>
        <mat-option value="Institucional">Institucional</mat-option>
        <mat-option value="Laboral">Laboral</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Teléfono</mat-label>
      <input matInput [(ngModel)]="data.telefono" placeholder="Ej: 3001234567">
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Teléfono Alterno</mat-label>
      <input matInput [(ngModel)]="data.alterno" placeholder="Opcional">
    </mat-form-field>

    <mat-form-field appearance="outline" class="span-all" subscriptSizing="dynamic">
      <mat-label>Descripción</mat-label>
      <textarea 
        matInput 
        [(ngModel)]="data.descripcion" 
        rows="3"
        placeholder="Observaciones adicionales"
      ></textarea>
    </mat-form-field>

  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="modal-actions">
  <button mat-button (click)="onNoClick()">Cancelar</button>

  <button 
    mat-raised-button 
    color="primary" 
    [mat-dialog-close]="data"
    [disabled]="!data.tipo || !data.telefono"
  >
    <mat-icon>check</mat-icon>
    Agregar a la lista
  </button>
</mat-dialog-actions>
