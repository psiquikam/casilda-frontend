<h2 mat-dialog-title class="modal-title">
  <mat-icon>phone</mat-icon>
  Agregar Teléfono
</h2>

<mat-dialog-content class="modal-content">
  <div class="form-row">

    <mat-form-field appearance="outline" class="field-tipo">
      <mat-label>Tipo</mat-label>
      <mat-select [(ngModel)]="data.tipoId" (selectionChange)="onTipoChange($event.value)">
        <mat-option *ngFor="let tipo of tiposTelefono" [value]="tipo.id">{{ tipo.nombre }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="field-tel">
      <mat-label>Teléfono</mat-label>
      <input matInput [(ngModel)]="data.telefono" placeholder="Ej: 3001234567">
    </mat-form-field>

    <mat-form-field appearance="outline" class="field-desc">
      <mat-label>Descripción</mat-label>
      <input matInput [(ngModel)]="data.descripcion" name="descripcionTelefono" #descripcionTelefono="ngModel" required placeholder="Nota breve">
      <mat-error *ngIf="descripcionTelefono.invalid && (descripcionTelefono.dirty || descripcionTelefono.touched)">
        La descripción es obligatoria
      </mat-error>
    </mat-form-field>

  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="modal-actions">
  <button mat-button (click)="onNoClick()">Cancelar</button>

  <button mat-flat-button class="btn-confirm" (click)="guardar()" [disabled]="!canSubmit">
    <mat-icon>check</mat-icon>
    Agregar
  </button>
</mat-dialog-actions>
