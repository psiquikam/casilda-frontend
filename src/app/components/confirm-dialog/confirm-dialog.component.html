<div class="confirm-container" [class.confirm-container--precaucion]="data.tono === 'precaucion'">

  <div class="confirm-header">
    <div class="icon-wrapper" aria-hidden="true">
      <mat-icon>{{ data.icono || 'warning' }}</mat-icon>
    </div>
    <div class="title-group">
      <!-- mat-dialog-title enlaza el título con el diálogo (aria-labelledby). -->
      <h2 mat-dialog-title>{{ data.titulo || 'Confirmar acción' }}</h2>
      <p class="subtitle">{{ data.subtitulo || 'Esta acción no se puede deshacer' }}</p>
    </div>
  </div>

  <div class="confirm-body">
    <p>{{ data.mensaje || '¿Estás seguro de continuar?' }}</p>
  </div>

  <div class="confirm-actions">
    @if (data.accionPrincipal === 'cancelar') {
      <!-- La opción segura es la principal y la que recibe el foco. -->
      <button mat-button type="button" class="confirm-actions__salir" (click)="confirmar()">
        <mat-icon aria-hidden="true">{{ data.iconoConfirmar || 'delete' }}</mat-icon>
        {{ data.textoConfirmar || 'Eliminar' }}
      </button>
      <button mat-flat-button type="button" color="primary" cdkFocusInitial (click)="cancelar()">
        {{ data.textoCancelar || 'Cancelar' }}
      </button>
    } @else {
      <!-- El foco inicial va a «Cancelar»: la opción segura ante una acción destructiva. -->
      <button mat-stroked-button type="button" cdkFocusInitial (click)="cancelar()">
        {{ data.textoCancelar || 'Cancelar' }}
      </button>
      <button mat-flat-button type="button" color="warn" (click)="confirmar()">
        <mat-icon aria-hidden="true">{{ data.iconoConfirmar || 'delete' }}</mat-icon>
        {{ data.textoConfirmar || 'Eliminar' }}
      </button>
    }
  </div>

</div>
