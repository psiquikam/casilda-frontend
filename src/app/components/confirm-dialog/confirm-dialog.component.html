<div class="confirm-container">

  <div class="confirm-header">
    <div class="icon-wrapper">
      <mat-icon aria-hidden="true">warning</mat-icon>
    </div>
    <div class="title-group">
      <!-- mat-dialog-title enlaza el título con el diálogo (aria-labelledby). -->
      <h2 mat-dialog-title>{{ data.titulo || 'Confirmar acción' }}</h2>
      <p class="subtitle">Esta acción no se puede deshacer</p>
    </div>
  </div>

  <div class="confirm-body">
    <p>{{ data.mensaje || '¿Estás seguro de continuar?' }}</p>
  </div>

  <div class="confirm-actions">
    <!-- El foco inicial va a «Cancelar»: la opción segura ante una acción destructiva. -->
    <button mat-stroked-button type="button" cdkFocusInitial (click)="cancelar()">
      Cancelar
    </button>

    <button mat-flat-button type="button" color="warn" (click)="confirmar()">
      <mat-icon aria-hidden="true">{{ data.iconoConfirmar || 'delete' }}</mat-icon>
      {{ data.textoConfirmar || 'Eliminar' }}
    </button>
  </div>

</div>
