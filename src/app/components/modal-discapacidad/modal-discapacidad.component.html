<h2 mat-dialog-title class="modal-title">
  <mat-icon aria-hidden="true">accessibility</mat-icon>
  Agregar Discapacidad
</h2>

<mat-dialog-content class="modal-content">
  <div class="form-row">

    <mat-form-field appearance="outline" class="field-subtipo">
      <mat-label>Discapacidad</mat-label>
      <mat-select [ngModel]="selectedSubTipoId" (ngModelChange)="onSubTipoChange($event)" [disabled]="!subTiposDiscapacidad.length">
        @for (subtipo of subTiposDiscapacidad; track subtipo.id) {
          <mat-option [value]="subtipo.id">{{ subtipo.nombre }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="field-desc">
      <mat-label>Observaciones (opcional)</mat-label>
      <input matInput [(ngModel)]="data.descripcion" placeholder="Detalle adicional">
    </mat-form-field>

  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="modal-actions">
  <button mat-button (click)="onNoClick()">Cancelar</button>
  <button mat-flat-button class="btn-confirm"
          [mat-dialog-close]="data"
          [disabled]="!selectedSubTipoId">
    <mat-icon aria-hidden="true">check</mat-icon> Agregar
  </button>
</mat-dialog-actions>
