<h2 mat-dialog-title class="modal-title">
  <mat-icon>accessibility</mat-icon>
  Agregar Discapacidad
</h2>

<mat-dialog-content class="modal-content">
  <div class="form-row">

    <mat-form-field appearance="outline" class="field-tipo">
      <mat-label>Tipo</mat-label>
      <mat-select [ngModel]="selectedTipoId" (ngModelChange)="onTipoChange($event)">
        @for (tipo of tiposDiscapacidad; track tipo.id) {
          <mat-option [value]="tipo.id">{{ tipo.nombre }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="field-subtipo">
      <mat-label>Subtipo</mat-label>
      <mat-select [(ngModel)]="data.subTipo" [disabled]="!selectedTipoId">
        @for (subtipo of subTiposDiscapacidad; track subtipo.id) {
          <mat-option [value]="subtipo.nombre">{{ subtipo.nombre }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="field-desc">
      <mat-label>Descripción / Detalle</mat-label>
      <input matInput [(ngModel)]="data.descripcion" placeholder="Detalle breve">
    </mat-form-field>

  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="modal-actions">
  <button mat-button (click)="onNoClick()">Cancelar</button>
  <button mat-flat-button class="btn-confirm"
          [mat-dialog-close]="data"
          [disabled]="!data.tipo || !data.descripcion">
    <mat-icon>check</mat-icon> Agregar
  </button>
</mat-dialog-actions>
