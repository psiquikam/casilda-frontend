<h2 mat-dialog-title class="modal-title">Agregar Discapacidad</h2>

<mat-dialog-content class="modal-content">
  <div class="form-grid">
    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Tipo de discapacidad</mat-label>
      <mat-select [(ngModel)]="data.tipo">
        <mat-option value="Física">Física</mat-option>
        <mat-option value="Auditiva">Auditiva</mat-option>
        <mat-option value="Visual">Visual</mat-option>
        <mat-option value="Sordoceguera">Sordoceguera</mat-option>
        <mat-option value="Intelectual">Intelectual</mat-option>
        <mat-option value="Psicosocial">Psicosocial</mat-option>
        <mat-option value="Múltiple">Múltiple</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Descripción / Detalle</mat-label>
      <textarea matInput [(ngModel)]="data.descripcion" rows="3" placeholder="Ej: Movilidad reducida en extremidades inferiores"></textarea>
    </mat-form-field>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="modal-actions">
  <button mat-button (click)="onNoClick()">Cancelar</button>
  <button mat-raised-button color="primary" [mat-dialog-close]="data" [disabled]="!data.tipo || !data.descripcion">
    <mat-icon>check</mat-icon> Agregar a la lista
  </button>
</mat-dialog-actions>
