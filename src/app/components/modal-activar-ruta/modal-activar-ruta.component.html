<h2 mat-dialog-title class="modal-title">
  <mat-icon>alt_route</mat-icon>
  Agregar ruta
</h2>

<mat-dialog-content class="modal-content">
  <div class="form-row">

    <mat-form-field appearance="outline" class="field-tipo">
      <mat-label>Tipo de Ruta</mat-label>
      <mat-select [(ngModel)]="data.tipo" (ngModelChange)="onTipoChange()">
        @for (tipo of tiposRutaActivacion; track tipo.id) {
          <mat-option [value]="tipo">{{ tipo.nombre }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="field-cual">
      <mat-label>¿Cuál?</mat-label>
      <mat-select [(ngModel)]="data.cual" [disabled]="!data.tipo">
        @for (ruta of rutasActivacion; track ruta.id) {
          <mat-option [value]="ruta">{{ ruta.nombre }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="modal-actions">
  <button mat-button (click)="onNoClick()">Cancelar</button>

  <button mat-flat-button class="btn-confirm" [mat-dialog-close]="{ idTipoRutaActivacion: data.tipo?.id, tipo: data.tipo?.nombre, idRutaActivacion: data.cual?.id, cual: data.cual?.nombre }" [disabled]="!data.tipo || !data.cual">
    <mat-icon>check</mat-icon>
    Agregar a la lista
  </button>
</mat-dialog-actions>
