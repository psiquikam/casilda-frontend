<div class="asignaciones-container">
  <header class="page-header">
    <div>
      <h1>Mis Casos Asignados</h1>
      <p>Gestión de acompañamientos psicosociales bajo su responsabilidad.</p>
    </div>
    <div class="user-welcome">
      <span>Bienvenido, <strong>Dr. Ricardo Luna</strong></span>
      <mat-icon>account_circle</mat-icon>
    </div>
  </header>

  <div class="summary-cards">
    <div class="mini-card warning"><strong>1</strong> Sin Cita</div>
    <div class="mini-card info"><strong>1</strong> Con Cita</div>
    <div class="mini-card danger"><strong>1</strong> Vencidos</div>
    <div class="mini-card success"><strong>1</strong> Cerrados</div>
  </div>

  <mat-card class="table-card">
    <div class="table-responsive">
      <table mat-table [dataSource]="misCasos">
        
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>Radicado</th>
          <td mat-cell *matCellDef="let element"><strong>{{element.id}}</strong></td>
        </ng-container>

        <ng-container matColumnDef="fecha">
          <th mat-header-cell *matHeaderCellDef>F. Asignación</th>
          <td mat-cell *matCellDef="let element">{{element.fecha}}</td>
        </ng-container>

        <ng-container matColumnDef="victima">
          <th mat-header-cell *matHeaderCellDef>Solicitante</th>
          <td mat-cell *matCellDef="let element">{{element.victima}}</td>
        </ng-container>

        <ng-container matColumnDef="estado">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let element">
            <span class="status-pill" [ngClass]="getEstadoClass(element.estado)">
              {{element.estado}}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="accion">
          <th mat-header-cell *matHeaderCellDef>Atender</th>
          <td mat-cell *matCellDef="let element">
            <button mat-flat-button color="primary" [routerLink]="['/detalle-acompanamiento', element.id]">
              <mat-icon>edit_calendar</mat-icon>
              Gestionar
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  </mat-card>
</div>
