<h2 mat-dialog-title class="modal-title">
  <mat-icon>assignment_turned_in</mat-icon>
  Seguimiento
</h2>

<mat-dialog-content class="modal-content">
  <div class="form-row">
    <mat-form-field appearance="outline" class="flex-field">
      <mat-label>Tipo de seguimiento</mat-label>
      <mat-select [(ngModel)]="data.idtiposeguimiento" (ngModelChange)="seleccionarTipoSeguimiento($event)"
        [disabled]="bloquearTipo || cargandoMaestros">
        <mat-option *ngFor="let opcion of tiposSeguimiento" [value]="opcion.id">
          {{opcion.nombre}}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="flex-field">
      <mat-label>Fecha</mat-label>
      <input matInput [matDatepicker]="picker" [(ngModel)]="data.fecha" placeholder="Seleccione fecha">
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
  </div>

  <div class="form-row">
    <mat-form-field appearance="outline" class="flex-field">
      <mat-label>Acción *</mat-label>
      <mat-select [(ngModel)]="data.idaccion" (ngModelChange)="seleccionarAccion($event)">
        <mat-option *ngFor="let opcion of acciones" [value]="opcion.id">{{opcion.nombre}}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="flex-field">
      <mat-label>Actividad *</mat-label>
      <mat-select [(ngModel)]="data.idactividad" (ngModelChange)="seleccionarActividad($event)" [disabled]="data.idaccion == null">
        <mat-option *ngFor="let opcion of actividades" [value]="opcion.id">{{opcion.nombre}}</mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div class="form-row">
    <mat-form-field appearance="outline" class="flex-field field-textarea">
      <mat-label>Descripción *</mat-label>
      <textarea matInput [(ngModel)]="data.descripcion" rows="5" placeholder="Ingrese detalles"></textarea>
    </mat-form-field>

    <div style="flex: 1; display: flex; flex-direction: column; gap: 8px;">
      <mat-form-field appearance="outline">
        <mat-label>Estado de seguimiento *</mat-label>
        <mat-select [(ngModel)]="data.idestadoseguimiento" (ngModelChange)="seleccionarEstadoSeguimiento($event)">
          <mat-option *ngFor="let opcion of estadosSeguimiento" [value]="opcion.id">{{opcion.nombre}}</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Motivo del estado *</mat-label>
        <mat-select [(ngModel)]="data.idmotivoestado" (ngModelChange)="seleccionarMotivoEstado($event)">
          <mat-option *ngFor="let opcion of motivosEstadoSeguimiento" [value]="opcion.id">{{opcion.nombre}}</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>

  <div class="file-section">
    <input type="file" #fileInput (change)="onFileSelected($event)" style="display: none;">
    <button mat-flat-button class="btn-file" (click)="fileInput.click()">
      Seleccionar archivo
    </button>
    <p class="file-name">{{ data.archivo ? data.archivo.name : 'Sin archivos seleccionados' }}</p>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="modal-actions">
  <button mat-button (click)="onNoClick()">Cancelar</button>
  <button mat-flat-button class="btn-confirm" (click)="guardar()"
    [disabled]="data.idtiposeguimiento == null || data.idaccion == null || data.idactividad == null || data.idestadoseguimiento == null || data.idmotivoestado == null || !data.descripcion || !data.fecha">
    <mat-icon>check</mat-icon>
    Guardar Seguimiento
  </button>
</mat-dialog-actions>
