<div class="gestion-container">
  <header class="page-header">
    <div>
      <h1>Gestión de Usuarios</h1>
      <p>Administre los accesos y roles del personal institucional.</p>
    </div>
    <button mat-raised-button color="primary" (click)="abrirFormulario()">
      <mat-icon>person_add</mat-icon> Nuevo Usuario
    </button>
  </header>

  <mat-card class="table-card">
    <table mat-table [dataSource]="dataSource" class="full-width">
      
      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef> Usuario </th>
        <td mat-cell *matCellDef="let user"> 
          <div class="user-cell">
            <div class="mini-avatar">{{user.nombre[0]}}</div>
            <strong>{{user.nombre}}</strong> 
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef> Correo Electrónico </th>
        <td mat-cell *matCellDef="let user"> {{user.email}} </td>
      </ng-container>

      <ng-container matColumnDef="rol">
        <th mat-header-cell *matHeaderCellDef> Rol </th>
        <td mat-cell *matCellDef="let user">
          <span class="role-badge" [ngClass]="user.rol.toLowerCase()">
            {{user.rol}}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="estado">
        <th mat-header-cell *matHeaderCellDef> Estado </th>
        <td mat-cell *matCellDef="let user">
          <button mat-button (click)="toggleEstado(user)" 
                  [color]="user.estado === 'Activo' ? 'primary' : 'warn'">
            <mat-icon>{{ user.estado === 'Activo' ? 'check_circle' : 'block' }}</mat-icon>
            {{user.estado}}
          </button>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef> Acciones </th>
        <td mat-cell *matCellDef="let user">
          <button mat-icon-button matTooltip="Editar" (click)="abrirFormulario(user)">
            <mat-icon svgIcon="icono-editar"></mat-icon>
          </button>
          <button mat-icon-button matTooltip="Eliminar" (click)="eliminarUsuario(user.id)">
            <mat-icon svgIcon="icono-eliminar"></mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                   showFirstLastButtons
                   aria-label="Seleccionar página de usuarios">
    </mat-paginator>
  </mat-card>
</div>
