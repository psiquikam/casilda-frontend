<mat-toolbar class="main-header">
  <div class="marca">
    <a class="marca__enlace" routerLink="/home">
      <!-- Distintivo de Casilda: acompaña al texto, no se integra al escudo UdeA.
           Pendiente de aval de Comunicaciones (ver CLAUDE.md §5). -->
      <mat-icon svgIcon="logo-custom" class="marca__distintivo" aria-hidden="true"></mat-icon>
      <span class="marca__nombre">Casilda</span>
      <span class="visually-hidden">— ir a la página de inicio</span>
    </a>
    @if (!auth.isAuthenticated()) {
      <span class="marca__descriptor">
        Sistema de vigilancia en salud pública para el abordaje de las violencias
        y las discriminaciones basadas en género
      </span>
    }
  </div>

  <div class="institucional">
    <div class="institucional__marca">
      <img src="assets/Logo-Udea-Blanco.png" alt="Universidad de Antioquia" class="institucional__logo">
      <span class="institucional__dependencia">Facultad Nacional de Salud Pública</span>
    </div>

    @if (auth.isAuthenticated()) {
      <button mat-button type="button" class="usuario" [matMenuTriggerFor]="userMenu"
        aria-label="Abrir el menú de la sesión">
        <mat-icon aria-hidden="true">account_circle</mat-icon>
        <span class="usuario__nombre">{{ auth.currentUser?.nombre }}</span>
      </button>
      <mat-menu #userMenu="matMenu">
        <button mat-menu-item type="button" (click)="auth.logout()">
          <mat-icon aria-hidden="true">logout</mat-icon>
          <span>Cerrar sesión</span>
        </button>
      </mat-menu>
    }
  </div>
</mat-toolbar>
