<h2 mat-dialog-title class="modal-title">
  <mat-icon aria-hidden="true">psychology</mat-icon>
  Agregar Apreciación Psicológica
</h2>

<mat-dialog-content class="modal-content">
  <mat-form-field appearance="outline" class="field-desc">
    <mat-label>Apreciación psicológica</mat-label>
    <textarea matInput [(ngModel)]="data.descripcion" rows="4"
      placeholder="Detalle la apreciación psicopedagógica o clínica"></textarea>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions align="end" class="modal-actions">
  <button mat-button (click)="onNoClick()">Cancelar</button>
  <button mat-flat-button class="btn-confirm" [mat-dialog-close]="data" [disabled]="!data.descripcion">
    <mat-icon aria-hidden="true">check</mat-icon>
    Agregar a la lista
  </button>
</mat-dialog-actions>
