<h2 mat-dialog-title class="modal-title">
  <mat-icon aria-hidden="true">fact_check</mat-icon>
  Agregar Hecho
</h2>

<mat-dialog-content class="modal-content">
  <div class="form-container">

    <div class="form-row-full">
      <mat-form-field appearance="outline">
        <mat-label>Fecha de ocurrencia del hecho *</mat-label>
        <input matInput [matDatepicker]="picker" [(ngModel)]="data.fecha" readonly placeholder="Seleccione mes y año">
        <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
        <mat-datepicker #picker
                        startView="multi-year"
                        (monthSelected)="setMonthAndYear($event, picker)">
        </mat-datepicker>
      </mat-form-field>
    </div>

    <div class="form-row-full">
      <mat-form-field appearance="outline">
        <mat-label>Lugar de Ocurrencia *</mat-label>
        <input matInput [(ngModel)]="data.lugar" placeholder="Ej: Aula 204, Oficina, Virtual...">
      </mat-form-field>
    </div>

    <div class="form-row-full">
      <mat-form-field appearance="outline" class="field-descripcion">
        <mat-label>
          Descripción de los Hechos *
          <button type="button" class="help-tooltip-trigger" matTooltip="Describa los hechos en circunstancias de tiempo, modo y lugar." matTooltipClass="casilda-help-tooltip" (click)="$event.stopPropagation()" aria-label="Ayuda">?</button>
        </mat-label>
        <textarea matInput [(ngModel)]="data.descripcion" rows="4"
          placeholder="Describa en detalle lo ocurrido..."></textarea>
      </mat-form-field>
    </div>

  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="modal-actions">
  <button mat-button (click)="onNoClick()">Cancelar</button>

  <button mat-flat-button class="btn-confirm" [mat-dialog-close]="data" [disabled]="!data.fecha || !data.descripcion || !data.lugar">
    <mat-icon aria-hidden="true">check</mat-icon>
    Agregar
  </button>
</mat-dialog-actions>
