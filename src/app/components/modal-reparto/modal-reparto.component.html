<div class="modal-container">
  <h2 mat-dialog-title class="modal-header">
    <mat-icon>assignment_ind</mat-icon>
    <span>Asignar Caso: {{ data.id }}</span>
  </h2>

  <mat-dialog-content class="modal-content">
    <form [formGroup]="repartoForm" class="reparto-form">

      <div class="form-grid">
        <mat-form-field appearance="outline">
          <mat-label>Tipo de Asignación</mat-label>
          <mat-select formControlName="idTipoAsignacion">
            <mat-option *ngFor="let tipo of tiposAsignacion" [value]="tipo.id">{{ tipo.nombre }}</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Servicio</mat-label>
          <mat-select formControlName="idTipoServicio">
            <mat-option *ngFor="let serv of tiposServicio" [value]="serv.id">{{ serv.nombre }}</mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Profesional o Dupla</mat-label>
          <mat-select formControlName="grupoProfesionalId">
            <mat-option *ngFor="let grupo of gruposProfesionales" [value]="grupo.id">
              {{ grupo.nombre }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline" class="full-width desc-field">
        <mat-label>Observaciones de la asignación</mat-label>
        <textarea matInput rows="4" formControlName="observaciones"></textarea>
      </mat-form-field>

    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="modal-footer">
    <button mat-button (click)="cerrar()" color="warn">Cancelar</button>
    <button mat-flat-button class="btn-confirm" (click)="guardar()"
      [disabled]="repartoForm.invalid">
      <mat-icon>check_circle</mat-icon>
      Confirmar Asignación
    </button>
  </mat-dialog-actions>
</div>
