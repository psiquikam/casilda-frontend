<div class="modal-container">
  <h2 mat-dialog-title class="modal-header">
    <mat-icon>assignment_ind</mat-icon>
    <span>Asignar Caso: {{ data.id }}</span>
  </h2>

  <mat-dialog-content class="modal-content">
    <form [formGroup]="repartoForm" class="reparto-form">
      
      <div class="form-grid">
        <mat-form-field appearance="outline">
          <mat-label>Tipo de Asignación</mat-label>
          <mat-select formControlName="tipoAsignacion">
            <mat-option *ngFor="let tipo of tiposAsignacion" [value]="tipo">
              {{ tipo }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Fecha de Reparto</mat-label>
          <input matInput type="date" formControlName="fechaReparto">
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Servicio</mat-label>
          <mat-select formControlName="servicio">
            <mat-option *ngFor="let serv of servicios" [value]="serv">
              {{ serv }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Asignar Profesional</mat-label>
          <mat-select formControlName="asignadoA">
            <mat-option *ngFor="let prof of profesionales" [value]="prof.id">
              {{ prof.nombre }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>

      <mat-form-field appearance="outline" class="full-width desc-field">
        <mat-label>Observaciones de la asignación</mat-label>
        <textarea matInput rows="5" formControlName="observaciones" placeholder="Indique detalles adicionales para el profesional..."></textarea>
      </mat-form-field>

    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="modal-footer">
    <button mat-button (click)="cerrar()" color="warn">Cancelar</button>
    <button mat-flat-button class="btn-confirm" (click)="guardar()" [disabled]="repartoForm.invalid">
      <mat-icon>check_circle</mat-icon>
      Confirmar Asignación
    </button>
  </mat-dialog-actions>
</div>
