<h2 mat-dialog-title class="modal-title">
  <mat-icon>assignment</mat-icon>
  Agregar Remisión
</h2>

<mat-dialog-content class="modal-content">
  <div class="form-row">

    <mat-form-field appearance="outline" class="field-tipo">
      <mat-label>Tipo de Remisión</mat-label>
      <mat-select [(ngModel)]="data.tipo">
        @for (tipo of tiposRemision; track tipo.id) {
          <mat-option [value]="tipo.nombre">{{ tipo.nombre }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="field-fecha">
      <mat-label>Fecha</mat-label>
      <input matInput [matDatepicker]="picker" [(ngModel)]="data.fecha">
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>

    <mat-form-field appearance="outline" class="field-cual">
      <mat-label>¿Cuál?</mat-label>
      <input matInput [(ngModel)]="data.cual" placeholder="Opcional">
    </mat-form-field>

  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="modal-actions">
  <button mat-button (click)="onNoClick()">Cancelar</button>

  <button mat-flat-button class="btn-confirm" [mat-dialog-close]="data" [disabled]="!data.tipo || !data.fecha">
    <mat-icon>check</mat-icon>
    Agregar a la lista
  </button>
</mat-dialog-actions>
