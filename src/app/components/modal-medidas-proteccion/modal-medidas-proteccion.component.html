<h2 mat-dialog-title class="modal-title">
  <mat-icon>security</mat-icon>
  Medidas de protección
</h2>

<mat-dialog-content class="modal-content">
  <div class="form-grid">

    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Tipo de medida <span class="required">*</span></mat-label>
      <mat-select [(ngModel)]="data.tipoMedidaId" (ngModelChange)="onTipoChange($event)">
        @for (t of tiposMedidaList; track t.id) {
          <mat-option [value]="t.id">{{ t.nombre }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Subtipo de medida <span class="required">*</span></mat-label>
      <mat-select [(ngModel)]="data.subtipoMedidaId" (ngModelChange)="onSubtipoChange($event)" [disabled]="!data.tipoMedidaId">
        @for (s of subtiposMedidaList; track s.id) {
          <mat-option [value]="s.id">{{ s.nombre }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Responsable <span class="required">*</span></mat-label>
      <mat-select [(ngModel)]="data.responsableId" (ngModelChange)="onResponsableChange($event)">
        @for (r of responsablesList; track r.id) {
          <mat-option [value]="r.id">{{ r.nombre }}</mat-option>
        }
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" subscriptSizing="dynamic">
      <mat-label>Descripción de la medida <span class="required">*</span></mat-label>
      <input matInput [(ngModel)]="data.descripcion" placeholder="Ingrese una descripción">
    </mat-form-field>

  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="modal-actions">
  <button mat-button (click)="onNoClick()">Cancelar</button>
  <button mat-flat-button class="btn-confirm"
    [mat-dialog-close]="data"
    [disabled]="!data.tipoMedidaId || !data.subtipoMedidaId || !data.responsableId || !data.descripcion">
    <mat-icon>check</mat-icon>
    Guardar
  </button>
</mat-dialog-actions>
