<div class="modal-container">
  <h2 mat-dialog-title class="modal-header">
    <mat-icon>event</mat-icon>
    <span>Asignar Cita: {{ data.id }}</span>
  </h2>

  <mat-dialog-content class="modal-content">
    <form [formGroup]="citaForm" class="reparto-form">

      <div class="form-grid">

        <mat-form-field appearance="outline">
          <mat-label>Fecha de Cita</mat-label>
          <input matInput [matDatepicker]="pickerCita" formControlName="fechaCita">
          <mat-datepicker-toggle matIconSuffix [for]="pickerCita"></mat-datepicker-toggle>
          <mat-datepicker #pickerCita></mat-datepicker>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Hora de Cita</mat-label>
          <input matInput type="time" formControlName="horaCita">
        </mat-form-field>
      </div>

    </form>
  </mat-dialog-content>

  <mat-dialog-actions align="end" class="modal-footer">
    <button mat-button (click)="cerrar()" color="warn">Cancelar</button>
    <button mat-flat-button class="btn-confirm" (click)="guardar()" [disabled]="citaForm.invalid">
      <mat-icon>check_circle</mat-icon>
      Guardar
    </button>
  </mat-dialog-actions>
</div>
