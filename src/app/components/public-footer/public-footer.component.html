<footer class="public-footer">
  <h2 class="visually-hidden">Canales de contacto de CASILDA</h2>
  <ul class="public-footer__lista">
    <!-- El teléfono solo aparece con un dato real configurado: un número de
         relleno en un canal de contacto impide que alguien reciba ayuda. -->
    @if (hayTelefonoContacto) {
      <li class="public-footer__item">
        <span class="public-footer__icono" aria-hidden="true"><mat-icon aria-hidden="true">phone</mat-icon></span>
        <a [href]="'tel:' + telefonoContacto">{{ telefonoContacto }}</a>
      </li>
    }
    <li class="public-footer__item">
      <span class="public-footer__icono" aria-hidden="true"><mat-icon aria-hidden="true">mail_outline</mat-icon></span>
      <a href="mailto:proyectocasilda&#64;udea.edu.co">proyectocasilda&#64;udea.edu.co</a>
    </li>
    <li class="public-footer__item">
      <span class="public-footer__icono" aria-hidden="true"><mat-icon aria-hidden="true">language</mat-icon></span>
      <a href="https://www.udea.edu.co" target="_blank" rel="noopener noreferrer">
        www.udea.edu.co
        <span class="visually-hidden">(se abre en una pestaña nueva)</span>
      </a>
    </li>
  </ul>
</footer>
