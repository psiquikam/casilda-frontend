<button
  type="button"
  class="btn-escape"
  aria-label="Salida rápida de seguridad. Presiona Alt más Q, o presiona dos veces la tecla Escape, para salir de Casilda de inmediato hacia un sitio neutral."
  aria-keyshortcuts="Alt+Q Escape"
  (click)="salir()">
  <mat-icon class="btn-escape-icon" aria-hidden="true">logout</mat-icon>
  <span class="btn-escape-text">Salida rápida (Alt + Q)</span>
</button>
