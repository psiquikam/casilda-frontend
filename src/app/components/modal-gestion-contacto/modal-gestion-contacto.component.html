<h2 mat-dialog-title>
    Gestión de Contacto - {{ data.id }}
</h2>

<mat-dialog-content class="modal-content">

    <mat-tab-group>
        <mat-tab label="Intento de Comunicación">

            <form [formGroup]="contactoForm" (ngSubmit)="registrarIntento()" class="form">

                <div class="form-grid">

                    <mat-form-field appearance="outline">
                        <mat-label>Fecha</mat-label>
                        <input matInput type="date" formControlName="fecha">
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>Hora</mat-label>
                        <input matInput type="time" formControlName="hora">
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>Jornada</mat-label>
                        <mat-select formControlName="jornada">
                            <mat-option *ngFor="let j of jornadas" [value]="j">{{ j }}</mat-option>
                        </mat-select>
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <mat-label>Resultado</mat-label>
                        <mat-select formControlName="resultado">
                            <mat-option *ngFor="let r of resultados" [value]="r">{{ r }}</mat-option>
                        </mat-select>
                    </mat-form-field>

                </div>

                <mat-form-field appearance="outline" class="full-width">
                    <mat-label>Observaciones</mat-label>
                    <textarea matInput rows="3" formControlName="observacion"></textarea>
                </mat-form-field>

                <div class="actions">
                    <button mat-raised-button color="primary" class="btn-save" type="submit"
                        [disabled]="contactoForm.invalid">
                        Guardar Registro
                    </button>
                </div>

            </form>

        </mat-tab>

        <mat-tab label="Historial">
            <div class="table-wrapper">
                <table mat-table [dataSource]="historialContactos">

                    <ng-container matColumnDef="fecha">
                        <th mat-header-cell *matHeaderCellDef>Fecha</th>
                        <td mat-cell *matCellDef="let e">{{ e.fecha }}<br><small>{{ e.hora }}</small></td>
                    </ng-container>

                    <ng-container matColumnDef="resultado">
                        <th mat-header-cell *matHeaderCellDef>Resultado</th>
                        <td mat-cell *matCellDef="let e">{{ e.resultado }}</td>
                    </ng-container>

                    <ng-container matColumnDef="observacion">
                        <th mat-header-cell *matHeaderCellDef>Observación</th>
                        <td mat-cell *matCellDef="let e">{{ e.observacion }}</td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="columnasHistorial"></tr>
                    <tr mat-row *matRowDef="let row; columns: columnasHistorial;"></tr>

                </table>

                <div *ngIf="historialContactos.length === 0" class="empty">
                    No hay registros
                </div>
            </div>
        </mat-tab>

    </mat-tab-group>

</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>Cerrar</button>
</mat-dialog-actions>
