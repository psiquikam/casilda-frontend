<h2 mat-dialog-title class="modal-title">
  <mat-icon aria-hidden="true">assignment</mat-icon>
  Compromiso de la Persona Atendida
</h2>

<mat-dialog-content class="modal-content">
  <div class="form-row"> <mat-form-field appearance="outline" class="flex-field">
    <mat-label>
      Fecha de Cumplimiento
      <button type="button" class="help-tooltip-trigger" matTooltip="Día acordado en que la persona cumplirá el compromiso (no corresponde a la fecha de registro o de la cita)." matTooltipClass="casilda-help-tooltip" (click)="$event.stopPropagation()" aria-label="Ayuda">?</button>
    </mat-label>
    <input matInput [matDatepicker]="picker" [(ngModel)]="data.fecha" placeholder="Seleccione fecha">
    <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
    <mat-datepicker #picker></mat-datepicker>
  </mat-form-field>

  <mat-form-field appearance="outline" class="flex-field">
    <mat-label>Seleccione el Compromiso</mat-label>
    <mat-select [(ngModel)]="data.idtipocompromiso" (ngModelChange)="seleccionarCompromiso($event)"
      [disabled]="cargandoCompromisos">
      @for (opcion of tiposCompromiso; track opcion) {
        <mat-option [value]="opcion.id">
          {{opcion.nombre}}
        </mat-option>
      }
    </mat-select>
  </mat-form-field>

</div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="modal-actions">
  <button mat-button (click)="onNoClick()">Cancelar</button>

  <button mat-flat-button class="btn-confirm" (click)="guardar()"
                [disabled]="data.idtipocompromiso === null || !data.fecha">
    <mat-icon aria-hidden="true">check</mat-icon>
    Agregar compromiso
  </button>
</mat-dialog-actions>
