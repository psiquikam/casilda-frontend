<div class="consulta-container">
  <header class="page-header">
    <div class="header-content">
      <h1>Consulta General de Casos</h1>
      <p>Gestión y seguimiento de solicitudes por estado actual</p>
    </div>
  </header>

  <mat-card class="table-card">
    <mat-tab-group animationDuration="200ms">
      
      <mat-tab label="Abierto activo">
        <div class="tab-body-wrapper">
          <ng-container *ngTemplateOutlet="tablaCasos; context: { dataSource: dataSourceActivos }"></ng-container>
        </div>
      </mat-tab>

      <mat-tab label="Abierto en transición">
        <div class="tab-body-wrapper">
          <ng-container *ngTemplateOutlet="tablaCasos; context: { dataSource: dataSourceTransicion }"></ng-container>
        </div>
      </mat-tab>

      <mat-tab label="Cerrado">
        <div class="tab-body-wrapper">
          <ng-container *ngTemplateOutlet="tablaCasos; context: { dataSource: dataSourceCerrados }"></ng-container>
        </div>
      </mat-tab>

    </mat-tab-group>
  </mat-card>
</div>

<ng-template #tablaCasos let-dataSource="dataSource">
  <div class="table-responsive">
    <table mat-table [dataSource]="dataSource">
      
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>
          <div class="header-inline-container">
            <span class="column-title">ID</span>
            <div class="search-box-slim">
              <input (keyup)="applyFilter('id', $event)" placeholder="Filtrar">
            </div>
          </div>
        </th>
        <td mat-cell *matCellDef="let element" class="id-cell">#{{element.id}}</td>
      </ng-container>

      <ng-container matColumnDef="nombre">
        <th mat-header-cell *matHeaderCellDef>
          <div class="header-inline-container">
            <span class="column-title">Usuario</span>
            <div class="search-box-slim">
              <input (keyup)="applyFilter('nombre', $event)" placeholder="Buscar...">
            </div>
          </div>
        </th>
        <td mat-cell *matCellDef="let element">{{element.nombre}}</td>
      </ng-container>

      <ng-container matColumnDef="documento">
        <th mat-header-cell *matHeaderCellDef>
          <div class="header-inline-container">
            <span class="column-title">Doc.</span>
            <div class="search-box-slim">
              <input (keyup)="applyFilter('documento', $event)" placeholder="N°">
            </div>
          </div>
        </th>
        <td mat-cell *matCellDef="let element">{{element.documento}}</td>
      </ng-container>

      <ng-container matColumnDef="fecha">
        <th mat-header-cell *matHeaderCellDef>
          <span class="column-title">Fecha Solicitud</span>
        </th>
        <td mat-cell *matCellDef="let element">{{element.fecha}}</td>
      </ng-container>

      <ng-container matColumnDef="dependencia">
        <th mat-header-cell *matHeaderCellDef>
          <span class="column-title">Dependencia</span>
        </th>
        <td mat-cell *matCellDef="let element">
          <span class="badge-soft">{{element.dependencia}}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="profesional">
        <th mat-header-cell *matHeaderCellDef>
          <div class="header-inline-container">
            <span class="column-title">Asignado</span>
            <div class="search-box-slim">
              <input (keyup)="applyFilter('profesional', $event)" placeholder="...">
            </div>
          </div>
        </th>
        <td mat-cell *matCellDef="let element">
          <span [class.text-danger]="element.profesional === 'Sin asignar'">{{element.profesional}}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef>
          <span class="column-title">Acciones</span>
        </th>
        <td mat-cell *matCellDef="let element">
          <button mat-icon-button class="action-purple" [routerLink]="['/detalle-acompanamiento', element.id]">
            <mat-icon>edit_square</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>

    <div *ngIf="dataSource.filteredData.length === 0" class="no-results-msg">
      No se encontraron registros.
    </div>
  </div>
</ng-template>
